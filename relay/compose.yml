# docker compose up -d --build   (on the host whose GPU and media the relay uses)
services:
  tizen-relay:
    build: .
    image: tizen-notifier-relay:local
    container_name: tizen-relay
    restart: unless-stopped
    ports:
      - "8792:8792"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${RELAY_MEDIA_HOST:-/mnt/media}:/media:ro
    environment:
      RELAY_ALLOW_HOSTS: ${RELAY_ALLOW_HOSTS:-}
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      RELAY_HW: ${RELAY_HW:-auto}
